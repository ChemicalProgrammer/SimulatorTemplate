<script>
  (function() {
    var state = {
      bootstrap: null,
      activeCase: null,
      isDirty: false,
      liveZoneDetails: {},
      lastUserScrollAt: 0,
      scrollRestoreFrame: null,
      scrollRestoreUntil: 0,
      experiment: {
        baseline: null,
        candidate: null,
        comparison: null
      },
      run: {
        commands: [],
        result: null,
        sampleIndex: 0,
        timer: null,
        playing: false,
        playbackConfigured: false,
        durationMode: 'FIXED',
        configuration: null
      }
    };

    document.addEventListener('DOMContentLoaded', function() {
      bindEvents();
      initialize();
    });
    window.addEventListener('resize', function() { renderPlaybackFrame(); });
    window.addEventListener('scroll', function() {
      if (Date.now() >= state.scrollRestoreUntil) state.lastUserScrollAt = Date.now();
    }, { passive: true });

    function bindEvents() {
      document.getElementById('workspace-form').addEventListener('submit', saveWorkspace);
      document.getElementById('new-case-form').addEventListener('submit', createDraftCase);
      document.getElementById('create-public-demo-case').addEventListener('click', createPublicDemoCase);
      document.getElementById('reload-case').addEventListener('click', reloadActiveCase);
      document.getElementById('delete-case').addEventListener('click', deleteActiveCase);
      document.getElementById('save-case').addEventListener('click', saveActiveCase);
      document.getElementById('add-equipment').addEventListener('click', addEquipment);
      document.getElementById('case-editor-form').addEventListener('input', markCaseDirty);
      document.getElementById('equipment-list').addEventListener('input', markCaseDirty);
      document.getElementById('equipment-list').addEventListener('change', markCaseDirty);
      document.getElementById('add-control-event').addEventListener('click', addControlEvent);
      document.getElementById('run-simulation').addEventListener('click', runSimulation);
      document.getElementById('set-baseline').addEventListener('click', setExperimentBaseline);
      document.getElementById('compare-baseline').addEventListener('click', compareCurrentToBaseline);
      document.getElementById('clear-baseline').addEventListener('click', clearExperimentBaseline);
      document.getElementById('play-simulation').addEventListener('click', startPlayback);
      document.getElementById('pause-simulation').addEventListener('click', pausePlayback);
      document.getElementById('reset-playback').addEventListener('click', resetPlayback);
      document.getElementById('duration-mode').addEventListener('change', function(event) {
        state.run.durationMode = event.target.value;
      });
    }

    function initialize() {
      setStatus('Loading console…');
      callServer('getBootstrap', [], renderBootstrap);
    }

    function renderBootstrap(response) {
      if (!response.ok) return showError(response.error);
      state.bootstrap = response.data;
      document.getElementById('user-email').textContent = response.data.user.email;
      document.getElementById('workspace-folder-id').value = response.data.settings.workspaceRootFolderId || '';
      document.getElementById('playback-rate').value = String(response.data.settings.preferredPlaybackRate || 1);
      if (!state.run.playbackConfigured) {
        document.getElementById('run-playback-rate').value = String(response.data.settings.preferredPlaybackRate || 1);
        state.run.playbackConfigured = true;
      }

      var hasWorkspace = Boolean(response.data.settings.workspaceRootFolderId);
      toggle('workspace-panel', true);
      toggle('cases-panel', hasWorkspace);
      toggle('engine-panel', hasWorkspace);
      renderCases(response.data.cases);
      if (!state.activeCase) setStatus(hasWorkspace ? 'Workspace connected.' : 'Connect a workspace folder to begin.');
    }

    function saveWorkspace(event) {
      event.preventDefault();
      setBusy('workspace-form', true);
      callServer('saveUserSettings', [{
        workspaceRootFolderId: document.getElementById('workspace-folder-id').value,
        preferredPlaybackRate: Number(document.getElementById('playback-rate').value)
      }], function(response) {
        setBusy('workspace-form', false);
        if (!response.ok) return showError(response.error);
        initialize();
      });
    }

    function createDraftCase(event) {
      event.preventDefault();
      var input = document.getElementById('new-case-name');
      setBusy('new-case-form', true);
      callServer('createCase', [{ name: input.value }], function(response) {
        setBusy('new-case-form', false);
        if (!response.ok) return showError(response.error);
        input.value = '';
        openCase(response.data.id);
        initialize();
      });
    }

    

function createPublicDemoCase() {
      setBusy('create-public-demo-case', true);
      callServer('createPublicDemoCase', [], function(response) {
        setBusy('create-public-demo-case', false);
        if (!response.ok) return showError(response.error);
        openCase(response.data.id);
        initialize();
      });
    }

    function deleteActiveCase() {
      if (!state.activeCase) return;
      requestCaseDeletion(state.activeCase.id, state.activeCase.name, document.getElementById('delete-case'));
    }

    function requestCaseDeletion(caseId, caseName, button) {
      if (!window.confirm('Move Case "' + caseName + '" to the Drive trash?')) return;
      if (button) button.disabled = true;
      callServer('deleteCase', [caseId], function(response) {
        if (button) button.disabled = false;
        if (!response.ok) return showError(response.error);
        var deletedActiveCase = state.activeCase && state.activeCase.id === caseId;
        if (deletedActiveCase) {
          stopPlaybackTimer();
          state.activeCase = null;
          state.isDirty = false;
          state.run.commands = [];
          state.run.result = null;
          state.run.configuration = null;
          resetExperiment();
          state.liveZoneDetails = {};
          toggle('editor-panel', false);
          toggle('run-panel', false);
        }
        initialize();
        setStatus('Case moved to Drive trash.');
      });
    }

function openCase(caseId) {
      callServer('getCase', [caseId], function(response) {
        if (!response.ok) return showError(response.error);
        stopPlaybackTimer();
        state.activeCase = response.data;
        state.isDirty = false;
        state.liveZoneDetails = {};
        state.run.commands = [];
        state.run.result = null;
        state.run.configuration = null;
        resetExperiment();
        renderEditor();
        setStatus('Case loaded.');
      });
    }

    function reloadActiveCase() {
      if (!state.activeCase) return;
      openCase(state.activeCase.id);
    }

    function markCaseDirty() {
      if (!state.activeCase) return;
      state.isDirty = true;
      state.experiment.candidate = null;
      state.experiment.comparison = null;
      renderEditorMeta();
      renderRunWorkspace();
    }

    function saveActiveCase() {
      var next = collectCaseEditor();
      if (!next) return;
      setBusy('save-case', true);
      callServer('saveCase', [next], function(response) {
        setBusy('save-case', false);
        if (!response.ok) return showError(response.error);
        state.activeCase = response.data;
        state.isDirty = false;
        renderEditor();
        initialize();
        setStatus('Case saved as revision ' + response.data.revision + '.');
      });
    }

    function addEquipment() {
      if (!syncEquipmentFromEditor()) return;
      state.activeCase.equipment.push(createBlankEquipment());
      state.isDirty = true;
      renderEquipment();
      renderRunWorkspace();
    }

    function renderCases(cases) {
      var target = document.getElementById('cases-list');
      target.textContent = '';
      if (!cases || !cases.length) {
        target.innerHTML = '<p class="empty">No cases yet. Start with the physical 13-unit demo or create a new Case.</p>';
        return;
      }
      cases.forEach(function(caseSummary) {
        var row = document.createElement('article');
        row.className = 'case-row';
        row.innerHTML = '<div><strong></strong><span></span></div><div class="case-actions"><span></span><button class="open-case" type="button">Open</button><button class="delete-case danger" type="button">Delete</button></div>';
        row.querySelector('strong').textContent = caseSummary.name;
        var dataLabel = caseSummary.dataClassification === 'PUBLIC_DEMONSTRATION_ONLY' ? ' · public demo data' : '';
        row.querySelector('div span').textContent = caseSummary.equipmentCount + ' equipment units · ' + (caseSummary.isSimulationReady ? 'simulation-ready' : 'draft') + dataLabel;
        row.querySelector('.case-actions span').textContent = new Date(caseSummary.updatedAt).toLocaleString();
        row.querySelector('.open-case').addEventListener('click', function() { openCase(caseSummary.id); });
        row.querySelector('.delete-case').addEventListener('click', function(event) {
          requestCaseDeletion(caseSummary.id, caseSummary.name, event.currentTarget);
        });
        target.appendChild(row);
      });
    }

function renderEditor() {
      if (!state.activeCase) return;
      toggle('editor-panel', true);
      document.getElementById('editor-title').textContent = state.activeCase.name;
      document.getElementById('case-name').value = state.activeCase.name;
      document.getElementById('unit-of-flow').value = state.activeCase.unitOfFlow || '';
      renderEditorMeta();
      renderCaseDataNote();
      renderEquipment();
      renderRawJson();
      renderRunWorkspace();
    }

    function renderEditorMeta() {
      if (!state.activeCase) return;
      var dirtyText = state.isDirty ? ' · unsaved changes' : '';
      document.getElementById('editor-meta').textContent = 'ID: ' + state.activeCase.id + ' · Revision ' + state.activeCase.revision + dirtyText;
    }

    function renderCaseDataNote() {
      var target = document.getElementById('case-data-note');
      var metadata = state.activeCase && state.activeCase.metadata ? state.activeCase.metadata : {};
      var note = typeof metadata.dataNote === 'string' ? metadata.dataNote : '';
      target.textContent = note;
      toggle('case-data-note', Boolean(note));
    }

    function renderEquipment() {
      var target = document.getElementById('equipment-list');
      target.textContent = '';
      state.activeCase.equipment.forEach(function(equipment, index) {
        target.appendChild(createEquipmentCard(equipment, index));
      });
      if (!state.activeCase.equipment.length) {
        target.innerHTML = '<p class="empty">This draft has no equipment. Add at least two units before simulation.</p>';
      }
      renderRawJson();
    }

    function createEquipmentCard(equipment, index) {
      var card = document.createElement('article');
      card.className = 'equipment-card';
      card.dataset.index = String(index);
      card.innerHTML = '<div class="equipment-header"><strong></strong><div class="button-row"><button class="move-up secondary" type="button">↑</button><button class="move-down secondary" type="button">↓</button><button class="remove-equipment danger" type="button">Remove</button></div></div><div class="equipment-grid"><label>Equipment ID<input class="equipment-id"></label><label>Type<select class="equipment-type"><option value="BLOWER">Blower</option><option value="BLOWMOLDER">Blowmolder</option><option value="CONVEYOR">Conveyor</option><option value="PACEMAKER">Pacemaker</option><option value="PUCKER">Pucker</option><option value="FILLER">Filler</option><option value="DEPUCKER">De-pucker</option><option value="SLEEVER">Sleever</option><option value="CASE_PACKER">Case packer</option><option value="PALLETIZER">Palletizer</option><option value="CUSTOM">Other / custom</option></select></label><label>Name<input class="equipment-name"></label><label>Nominal rate / sec<input class="equipment-rate" type="number" min="0" step="any"></label><label>Initial mode<select class="equipment-mode"><option value="AUTO">Automatic</option><option value="MANUAL">Manual</option><option value="PAUSE">Paused</option><option value="STOP">Stopped</option></select></label></div><section class="format-zone-setup"><div class="format-zone-heading"><div><strong>FlowPilot conveyor design</strong><p>Required for every conveyor. Geometry is always active: the engine derives conveyor velocity, pitch, capacity, Prime, Back-up margin, recovery, and audit from these named inputs.</p></div></div><div class="format-zone-grid"><label>Installed length L_act (mm)<input class="format-zone-lact" type="number" min="0" step="any"></label><label>Prime reserve L_p (mm)<input class="format-zone-lp-prime" type="number" min="0" step="any"></label><label>Package length (mm)<input class="format-zone-package-length" type="number" min="0" step="any"></label><label>Upstream discharge pitch (mm)<input class="format-zone-discharge-pitch" type="number" min="0" step="any"></label><label>Conveyor speed factor (%)<input class="format-zone-speed-factor" type="number" min="0" step="any"></label><label>Installed Back-up position (mm)<input class="format-zone-backup" type="number" min="0" step="any"></label><label>Discharge runout (mm)<input class="format-zone-discharge-runout" type="number" min="0" step="any"></label><label>Reject runout (mm)<input class="format-zone-reject-runout" type="number" min="0" step="any"></label><label>Blocked time delay (s)<input class="format-zone-blocked-delay" type="number" min="0" step="any"></label><label>Clear time delay (s)<input class="format-zone-clear-delay" type="number" min="0" step="any"></label><label>Insurance factor (units)<input class="format-zone-insurance" type="number" min="0" step="any"></label><label>Upstream stop response (s)<input class="format-zone-stop-response" type="number" min="0" step="any"></label><label>Bottles discharged at stop<input class="format-zone-residual" type="number" min="0" step="any"></label><label>Downstream ramp-up (s)<input class="format-zone-downstream-ramp" type="number" min="0" step="any"></label></div><p class="format-zone-preview"></p></section><label class="characteristics-label">Characteristics JSON (optional)<textarea class="equipment-characteristics" spellcheck="false"></textarea></label><label class="characteristics-label">Noise profile JSON (optional)<textarea class="equipment-noise-profile" spellcheck="false"></textarea></label><label class="characteristics-label">Advanced process format JSON (optional)<textarea class="equipment-process-data" spellcheck="false"></textarea></label>';
      card.querySelector('strong').textContent = 'Step ' + (index + 1);
      card.querySelector('.equipment-id').value = equipment.id || '';
      card.querySelector('.equipment-type').value = equipment.type || 'CUSTOM';
      card.querySelector('.equipment-name').value = equipment.name || '';
      card.querySelector('.equipment-rate').value = equipment.nominalRatePerSecond === undefined ? '' : equipment.nominalRatePerSecond;
      card.querySelector('.equipment-mode').value = equipment.initialMode || 'AUTO';
      card.querySelector('.equipment-characteristics').value = JSON.stringify(equipment.characteristics || {}, null, 2);
      card.querySelector('.equipment-noise-profile').value = JSON.stringify(equipment.noiseProfile || {}, null, 2);
      card.querySelector('.equipment-process-data').value = JSON.stringify(equipment.processData || {}, null, 2);

      applyConceptTooltips(card);
      populateFormatZoneInputs(card, equipment);
      updateFormatZoneVisibility(card);
      renderFormatZonePreview(card);

      card.querySelector('.move-up').disabled = index === 0;
      card.querySelector('.move-down').disabled = index === state.activeCase.equipment.length - 1;
      card.querySelector('.move-up').addEventListener('click', function() { moveEquipment(index, -1); });
      card.querySelector('.move-down').addEventListener('click', function() { moveEquipment(index, 1); });
      card.querySelector('.remove-equipment').addEventListener('click', function() { removeEquipment(index); });
      card.querySelector('.equipment-type').addEventListener('change', function() {
        updateFormatZoneVisibility(card);
        renderFormatZonePreview(card);
      });
      Array.prototype.slice.call(card.querySelectorAll('.format-zone-grid input')).forEach(function(input) {
        input.addEventListener('input', function() {
          state.isDirty = true;
          renderFormatZonePreview(card);
        });
      });
      return card;
    }

    function applyConceptTooltips(card) {
      var concepts = [
        ['.format-zone-lact', 'Total installed conveyor length, measured from the upstream discharge toward the downstream infeed.'],
        ['.format-zone-lp-prime', 'Reserved downstream length between the Prime photocell and the downstream machine infeed.'],
        ['.format-zone-package-length', 'Physical package length in the direction of travel. It determines the photoeye occupied time.'],
        ['.format-zone-discharge-pitch', 'Centre-to-centre distance between packages leaving the upstream machine.'],
        ['.format-zone-speed-factor', 'Belt-speed increase relative to upstream package discharge velocity. It changes package spacing and population.'],
        ['.format-zone-backup', 'Installed Back-up photocell position, measured from the upstream discharge. A sustained blocked signal requests the upstream stop.'],
        ['.format-zone-discharge-runout', 'Length that must be cleared after the upstream discharge before a stop fully takes effect.'],
        ['.format-zone-reject-runout', 'Additional reject/runout length that must be cleared during an upstream stop.'],
        ['.format-zone-blocked-delay', 'Continuous Back-up blocked time required before the simulator requests the upstream stop. Normal package pulses do not count.'],
        ['.format-zone-clear-delay', 'Continuous Back-up clear time required before the simulator releases the upstream stop. Normal product gaps reset this timer.'],
        ['.format-zone-insurance', 'Extra package margin reserved in the required overflow calculation. It is a design margin, not randomly created material.'],
        ['.format-zone-stop-response', 'Delay from the upstream stop request until its discharge response is complete.'],
        ['.format-zone-residual', 'Packages that can still leave the upstream machine after the stop request.'],
        ['.format-zone-downstream-ramp', 'Time for the downstream machine to ramp after Prime authorizes its start.']
      ];
      concepts.forEach(function(entry) {
        var input = card.querySelector(entry[0]);
        if (input && input.closest('label')) input.closest('label').title = entry[1];
      });
      setFormatFieldLabel(card, '.format-zone-blocked-delay', 'Back-up blocked delay (s)');
      setFormatFieldLabel(card, '.format-zone-clear-delay', 'Back-up clear delay (s)');
    }

    function setFormatFieldLabel(card, selector, labelText) {
      var input = card.querySelector(selector);
      var label = input && input.closest('label');
      if (label && label.firstChild && label.firstChild.nodeType === Node.TEXT_NODE) {
        label.firstChild.nodeValue = labelText;
      }
    }

function populateFormatZoneInputs(card, equipment) {
      var formatZone = equipment.processData?.accumulation || {};
      var geometry = equipment.processData?.geometry || {};
      var upstream = equipment.processData?.upstream || {};
      var values = {
        lact: geometry.lactMm,
        lpPrime: geometry.lpPrimeMm,
        packageLength: upstream.packageLengthMm,
        dischargePitch: upstream.dischargePitchMm,
        speedFactor: firstDefinedValue(formatZone.conveyorSpeedFactorPercent, equipment.processData?.speedAndSensors?.conveyorSpeedFactorVsDischargeVelocityPercent),
        backup: formatZone.backupSensorPositionMm,
        dischargeRunout: formatZone.dischargeRunoutLengthMm,
        rejectRunout: formatZone.rejectRunoutLengthMm,
        blockedDelay: formatZone.blockedTimeDelaySeconds,
        clearDelay: formatZone.clearTimeDelaySeconds,
        insurance: formatZone.insuranceFactorUnits,
        stopResponse: formatZone.upstreamStopResponseSeconds,
        residual: formatZone.bottlesDischargedAtStop,
        downstreamRamp: formatZone.downstreamRampUpSeconds
      };
      Object.keys(values).forEach(function(key) {
        var input = card.querySelector('.format-zone-' + kebabCase(key));
        if (input) input.value = values[key] === undefined || values[key] === null ? '' : values[key];
      });
    }

function updateFormatZoneVisibility(card) {
      var isConveyor = card.querySelector('.equipment-type').value === 'CONVEYOR';
      card.querySelector('.format-zone-setup').classList.toggle('hidden', !isConveyor);
    }

    function renderFormatZonePreview(card) {
      var target = card.querySelector('.format-zone-preview');
      if (!target) return;
      if (card.querySelector('.equipment-type').value !== 'CONVEYOR') {
        target.textContent = '';
        return;
      }

      var values = readFormatZoneInputs(card);
      var processData = parseJsonForPreview(card.querySelector('.equipment-process-data').value);
      var index = Number(card.dataset.index);
      var upstreamMachine = state.activeCase?.equipment?.[index - 1];
      var downstreamMachine = state.activeCase?.equipment?.[index + 1];
      var calculator = window.SimulatorEngine?.calculateConveyorEngineering;
      if (!calculator || !upstreamMachine || !downstreamMachine) {
        target.textContent = 'FlowPilot preview becomes available when this conveyor sits between an upstream and downstream machine.';
        return;
      }
      var calculation = calculator({
        installedLengthMm: values.lactMm,
        primeReserveMm: values.lpPrimeMm,
        packageLengthMm: values.packageLengthMm,
        upstreamDischargePitchMm: values.dischargePitchMm,
        upstreamNominalSpeedBpm: Number(upstreamMachine.nominalRatePerSecond) * 60,
        downstreamHighSpeedBpm: firstDefinedValue(downstreamMachine.processData?.equipment?.maximumSpeedBpm, Number(downstreamMachine.nominalRatePerSecond) * 60),
        downstreamInfeedPitchMm: downstreamMachine.processData?.downstream?.infeedPitchMm,
        conveyorSpeedFactorPercent: values.conveyorSpeedFactorPercent,
        dischargeRunoutLengthMm: values.dischargeRunoutLengthMm,
        rejectRunoutLengthMm: values.rejectRunoutLengthMm,
        blockedTimeDelaySeconds: values.blockedTimeDelaySeconds,
        clearTimeDelaySeconds: values.clearTimeDelaySeconds,
        insuranceFactorUnits: values.insuranceFactorUnits,
        backupSensorPositionMm: values.backupSensorPositionMm,
        upstreamStopResponseSeconds: values.upstreamStopResponseSeconds,
        bottlesDischargedAtStop: values.bottlesDischargedAtStop,
        downstreamRampUpSeconds: values.downstreamRampUpSeconds,
        upstreamStartupTimeSeconds: upstreamMachine.processData?.upstream?.startupTimeSeconds
      });
      var derived = calculation.calculated;
      if (!(derived.conveyorCapacityUnits >= 1)) {
        target.textContent = 'Required: L_act, L_p, package length, upstream discharge pitch, upstream BPM, and conveyor speed factor.';
        return;
      }
      target.textContent = 'Calculated: ' + formatNumber(derived.conveyorSpeedMmPerSecond) + ' mm/s · ' +
        formatNumber(derived.effectiveProductPitchMm) + ' mm pitch · ' + formatNumber(derived.conveyorCapacityUnits) +
        ' units · Prime ' + formatNumber(derived.primeSensorPositionMm) + ' mm · required Back-up ≥ ' +
        formatNumber(derived.recommendedBackupSensorPositionMm) + ' mm · L_rec ' +
        formatNumber(derived.recoveryLengthMm) + ' mm · normal photoeye pulse ' +
        formatSeconds(derived.packagePassSensorSeconds) + ' · normal clear gap ' +
        formatSeconds(derived.sensorClearGapSeconds) + ' (' + calculation.audit.status + ').';
    }

function readFormatZoneInputs(card) {
      return {
        lactMm: numericInputValue(card.querySelector('.format-zone-lact')),
        lpPrimeMm: numericInputValue(card.querySelector('.format-zone-lp-prime')),
        packageLengthMm: numericInputValue(card.querySelector('.format-zone-package-length')),
        dischargePitchMm: numericInputValue(card.querySelector('.format-zone-discharge-pitch')),
        conveyorSpeedFactorPercent: numericInputValue(card.querySelector('.format-zone-speed-factor')),
        backupSensorPositionMm: numericInputValue(card.querySelector('.format-zone-backup')),
        dischargeRunoutLengthMm: numericInputValue(card.querySelector('.format-zone-discharge-runout')),
        rejectRunoutLengthMm: numericInputValue(card.querySelector('.format-zone-reject-runout')),
        blockedTimeDelaySeconds: numericInputValue(card.querySelector('.format-zone-blocked-delay')),
        clearTimeDelaySeconds: numericInputValue(card.querySelector('.format-zone-clear-delay')),
        insuranceFactorUnits: numericInputValue(card.querySelector('.format-zone-insurance')),
        upstreamStopResponseSeconds: numericInputValue(card.querySelector('.format-zone-stop-response')),
        bottlesDischargedAtStop: numericInputValue(card.querySelector('.format-zone-residual')),
        downstreamRampUpSeconds: numericInputValue(card.querySelector('.format-zone-downstream-ramp'))
      };
    }

    function mergeFormatZoneData(processData, values) {
      var result = Object.assign({}, processData);
      result.geometry = Object.assign({}, result.geometry || {}, {
        lactMm: values.lactMm,
        lpPrimeMm: values.lpPrimeMm
      });
      result.upstream = Object.assign({}, result.upstream || {}, {
        packageLengthMm: values.packageLengthMm,
        dischargePitchMm: values.dischargePitchMm,
        bottlesDischargedAtStop: values.bottlesDischargedAtStop
      });
      result.speedAndSensors = Object.assign({}, result.speedAndSensors || {}, {
        conveyorSpeedFactorVsDischargeVelocityPercent: values.conveyorSpeedFactorPercent
      });
      result.accumulation = Object.assign({}, result.accumulation || {}, {
        conveyorSpeedFactorPercent: values.conveyorSpeedFactorPercent,
        backupSensorPositionMm: values.backupSensorPositionMm,
        dischargeRunoutLengthMm: values.dischargeRunoutLengthMm,
        rejectRunoutLengthMm: values.rejectRunoutLengthMm,
        blockedTimeDelaySeconds: values.blockedTimeDelaySeconds,
        clearTimeDelaySeconds: values.clearTimeDelaySeconds,
        insuranceFactorUnits: values.insuranceFactorUnits,
        upstreamStopResponseSeconds: values.upstreamStopResponseSeconds,
        bottlesDischargedAtStop: values.bottlesDischargedAtStop,
        downstreamRampUpSeconds: values.downstreamRampUpSeconds
      });
      Object.keys(result.accumulation).forEach(function(key) {
        if (result.accumulation[key] === undefined) delete result.accumulation[key];
      });
      ['usableLengthMm', 'productLengthMm', 'gapMm', 'productPitchMm', 'conveyorSpeedMmPerSecond', 'primeSensorPositionMm', 'backupRestartPositionMm'].forEach(function(key) {
        delete result.accumulation[key];
      });
      return result;
    }



function numericInputValue(input) {
      if (!input || !String(input.value).trim()) return undefined;
      return Number(input.value);
    }

    function parseJsonForPreview(rawValue) {
      if (!rawValue || !rawValue.trim()) return {};
      try {
        var parsed = JSON.parse(rawValue);
        return parsed && typeof parsed === 'object' && !Array.isArray(parsed) ? parsed : {};
      } catch (error) {
        return {};
      }
    }

    function firstDefinedValue() {
      for (var index = 0; index < arguments.length; index += 1) {
        var value = arguments[index];
        if (value !== undefined && value !== null) return value;
      }
      return undefined;
    }

    function kebabCase(value) {
      return String(value).replace(/[A-Z]/g, function(letter) { return '-' + letter.toLowerCase(); });
    }

    function isFiniteNumber(value) {
      return typeof value === 'number' && Number.isFinite(value);
    }

    function moveEquipment(index, direction) {
      if (!syncEquipmentFromEditor()) return;
      var targetIndex = index + direction;
      if (targetIndex < 0 || targetIndex >= state.activeCase.equipment.length) return;
      var moved = state.activeCase.equipment.splice(index, 1)[0];
      state.activeCase.equipment.splice(targetIndex, 0, moved);
      state.isDirty = true;
      renderEquipment();
      renderRunWorkspace();
    }

    function removeEquipment(index) {
      if (!syncEquipmentFromEditor()) return;
      state.activeCase.equipment.splice(index, 1);
      state.isDirty = true;
      renderEquipment();
      renderRunWorkspace();
    }

    function collectCaseEditor() {
      if (!state.activeCase || !syncEquipmentFromEditor()) return null;
      state.activeCase.name = document.getElementById('case-name').value;
      state.activeCase.unitOfFlow = document.getElementById('unit-of-flow').value;
      return {
        id: state.activeCase.id,
        expectedRevision: state.activeCase.revision,
        name: state.activeCase.name,
        unitOfFlow: state.activeCase.unitOfFlow,
        equipment: state.activeCase.equipment,
        engineConfig: state.activeCase.engineConfig || {},
        metadata: state.activeCase.metadata || {}
      };
    }

    function syncEquipmentFromEditor() {
      if (!state.activeCase) return false;
      var cards = Array.prototype.slice.call(document.querySelectorAll('.equipment-card'));
      var equipment = [];
      for (var index = 0; index < cards.length; index += 1) {
        var card = cards[index];
        var characteristics = parseJsonObject(card.querySelector('.equipment-characteristics').value, 'Characteristics', index + 1);
        if (characteristics === null) return false;
        var noiseProfile = parseJsonObject(card.querySelector('.equipment-noise-profile').value, 'Noise profile', index + 1);
        if (noiseProfile === null) return false;
        var processData = parseJsonObject(card.querySelector('.equipment-process-data').value, 'Process format data', index + 1);
        if (processData === null) return false;
        var type = card.querySelector('.equipment-type').value;
        if (type === 'CONVEYOR') {
          processData = mergeFormatZoneData(processData, readFormatZoneInputs(card));
        } else {
          delete processData.accumulation;
        }
        equipment.push({
          id: card.querySelector('.equipment-id').value.trim(),
          type: type,
          name: card.querySelector('.equipment-name').value.trim(),
          nominalRatePerSecond: Number(card.querySelector('.equipment-rate').value),
          initialMode: card.querySelector('.equipment-mode').value,
          characteristics: characteristics,
          noiseProfile: noiseProfile,
          processData: processData
        });
      }
      state.activeCase.equipment = equipment;
      renderRawJson();
      return true;
    }

function parseJsonObject(rawValue, label, step) {
      if (!rawValue.trim()) return {};
      try {
        var parsed = JSON.parse(rawValue);
        if (!parsed || Array.isArray(parsed) || typeof parsed !== 'object') throw new Error('not an object');
        return parsed;
      } catch (error) {
        showError({ code: 'INVALID_EQUIPMENT_JSON', message: label + ' for equipment step ' + step + ' must contain a JSON object.' });
        return null;
      }
    }

    

function createBlankEquipment() {
      return {
        id: '',
        type: 'CUSTOM',
        name: '',
        nominalRatePerSecond: undefined,
        initialMode: 'AUTO',
        characteristics: {},
        noiseProfile: {},
        processData: {}
      };
    }

function renderRawJson() {
      var preview = document.getElementById('case-json-preview');
      if (state.activeCase) preview.value = JSON.stringify(state.activeCase, null, 2);
    }

    function renderRunWorkspace() {
      var canRender = Boolean(state.activeCase);
      toggle('run-panel', canRender);
      if (!canRender) return;
      var ready = isRunReady();
      document.getElementById('run-case-meta').textContent = state.activeCase.name + ' · revision ' + state.activeCase.revision + (state.isDirty ? ' · save changes before running' : '');
      toggle('run-not-ready', !ready || state.isDirty);
      document.getElementById('run-simulation').disabled = !ready || state.isDirty;
      renderControlEvents();
      renderExperimentWorkspace();
      if (!state.run.result) toggle('simulation-results', false);
    }

    function isRunReady() {
      return state.activeCase && Array.isArray(state.activeCase.equipment) && state.activeCase.equipment.length >= 2;
    }

    function resetExperiment() {
      state.experiment.baseline = null;
      state.experiment.candidate = null;
      state.experiment.comparison = null;
      renderExperimentWorkspace();
    }

    function renderExperimentWorkspace() {
      var status = document.getElementById('experiment-status');
      var summary = document.getElementById('experiment-summary');
      var setBaselineButton = document.getElementById('set-baseline');
      var compareButton = document.getElementById('compare-baseline');
      var clearButton = document.getElementById('clear-baseline');
      if (!status || !summary || !setBaselineButton || !compareButton || !clearButton) return;

      var ready = isRunReady() && !state.isDirty;
      var baseline = state.experiment.baseline;
      setBaselineButton.disabled = !ready;
      compareButton.disabled = !isRunReady() || !baseline;
      clearButton.disabled = !baseline;
      summary.textContent = '';

      if (!baseline) {
        status.textContent = state.isDirty
          ? 'Save the Case before capturing a baseline.'
          : 'No baseline has been captured for this browser session.';
        summary.classList.add('hidden');
        return;
      }

      var seedText = formatSeedSet(baseline.seedSet);
      status.textContent = 'Baseline: ' + baseline.caseName + ' · revision ' + baseline.caseRevision + ' · ' +
        baseline.seedSet.length + ' replications · seeds ' + seedText + '. ' +
        (state.experiment.comparison
          ? 'Δ values mean candidate minus baseline using these same seeds.' + (state.experiment.candidate?.unsaved ? ' The candidate has not been saved to Drive.' : '')
          : state.isDirty
            ? 'Current edits are an unsaved What-If and can be compared without overwriting the baseline Case.'
            : 'Edit the Case, then compare the current scenario against this snapshot.');
      summary.classList.remove('hidden');
      summary.appendChild(createScenarioOverview('Baseline', baseline.scenario.summary.line));
      if (state.experiment.comparison && state.experiment.candidate) {
        summary.appendChild(createScenarioOverview('Current', state.experiment.candidate.scenario.summary.line));
        summary.appendChild(createComparisonOverview(state.experiment.comparison.summary.line));
        summary.appendChild(createConveyorComparisonTable(state.experiment.comparison.summary.zones));
      }
    }

    function setExperimentBaseline() {
      if (state.isDirty) return showError({ code: 'UNSAVED_CASE', message: 'Save the Case before capturing a baseline.' });
      var run = readRunConfiguration();
      var seeds = readExperimentSeeds(run);
      if (!run || !seeds) return;
      setExperimentBusy(true);
      setStatus('Running ' + seeds.length + ' compact baseline replications…');
      window.setTimeout(function() {
        try {
          var response = window.SimulatorEngine.runScenarioExperiment({
            case: cloneJson(state.activeCase),
            run: cloneJson(run),
            seeds: seeds
          });
          setExperimentBusy(false);
          if (!response.ok) return showError(response.error);
          state.experiment.baseline = {
            caseName: state.activeCase.name,
            caseRevision: state.activeCase.revision,
            caseSnapshot: cloneJson(state.activeCase),
            run: cloneJson(run),
            seedSet: seeds,
            scenario: response.scenario
          };
          state.experiment.candidate = null;
          state.experiment.comparison = null;
          renderExperimentWorkspace();
          setStatus('Baseline completed: ' + seeds.length + ' compact replications. Edit and save a What-If, then compare it using the same seeds.');
        } catch (error) {
          setExperimentBusy(false);
          showError({ code: 'EXPERIMENT_ERROR', message: error && error.message ? error.message : 'The baseline experiment could not be completed.' });
        }
      }, 0);
    }

    function compareCurrentToBaseline() {
      var baseline = state.experiment.baseline;
      if (!baseline) return showError({ code: 'BASELINE_REQUIRED', message: 'Capture a baseline before comparing the current Case.' });
      if (state.isDirty && !collectCaseEditor()) return;
      var run = readRunConfiguration();
      if (!run) return;
      if (run.durationSeconds !== baseline.run.durationSeconds || run.tickSeconds !== baseline.run.tickSeconds) {
        return showError({
          code: 'INCOMPATIBLE_EXPERIMENT_RUN',
          message: 'Use the same virtual duration and integration step as the baseline so the paired comparison is meaningful.'
        });
      }
      setExperimentBusy(true);
      setStatus('Running current scenario against the baseline seed set…');
      window.setTimeout(function() {
        try {
          var candidateResponse = window.SimulatorEngine.runScenarioExperiment({
            case: cloneJson(state.activeCase),
            run: cloneJson(run),
            seeds: baseline.seedSet
          });
          setExperimentBusy(false);
          if (!candidateResponse.ok) return showError(candidateResponse.error);
          var comparisonResponse = window.SimulatorEngine.compareScenarioExperiments(baseline.scenario, candidateResponse.scenario);
          if (!comparisonResponse.ok) return showError(comparisonResponse.error);
          state.experiment.candidate = {
            caseName: state.activeCase.name,
            caseRevision: state.activeCase.revision,
            unsaved: state.isDirty,
            run: cloneJson(run),
            scenario: candidateResponse.scenario
          };
          state.experiment.comparison = comparisonResponse.comparison;
          renderExperimentWorkspace();
          setStatus('Comparison completed. Δ values are candidate minus baseline across the same ' + baseline.seedSet.length + ' seeds.');
        } catch (error) {
          setExperimentBusy(false);
          showError({ code: 'EXPERIMENT_ERROR', message: error && error.message ? error.message : 'The scenario comparison could not be completed.' });
        }
      }, 0);
    }

    function clearExperimentBaseline() {
      resetExperiment();
      setStatus('Baseline and comparison cleared from this browser session.');
    }

    function setExperimentBusy(busy) {
      ['set-baseline', 'compare-baseline', 'clear-baseline'].forEach(function(id) {
        var button = document.getElementById(id);
        if (button) button.disabled = busy || button.disabled;
      });
      if (!busy) renderExperimentWorkspace();
    }

    function readExperimentSeeds(run) {
      var repetitions = Number(document.getElementById('experiment-repetitions').value);
      if (!Number.isInteger(repetitions) || repetitions < 1 || repetitions > 20) {
        showError({ code: 'INVALID_EXPERIMENT_CONFIGURATION', message: 'Replications must be an integer from 1 to 20.' });
        return null;
      }
      if (!Number.isSafeInteger(run.seed) || run.seed < 0 || run.seed + repetitions - 1 > 4294967295) {
        showError({ code: 'INVALID_EXPERIMENT_CONFIGURATION', message: 'The starting seed must leave room for every sequential 32-bit seed.' });
        return null;
      }
      return Array.from({ length: repetitions }, function(_, index) { return run.seed + index; });
    }

    function createScenarioOverview(label, metrics) {
      var section = document.createElement('section');
      section.className = 'experiment-overview';
      section.appendChild(createExperimentMetric(label + ' mean output', formatExperimentDistribution(metrics.outputCount, ' units'), 'Mean output; P10–P90: ' + formatExperimentRange(metrics.outputCount, ' units')));
      section.appendChild(createExperimentMetric(label + ' mean rate', formatExperimentDistribution(metrics.averageOutputRatePerMinute, ' /min'), 'Mean output rate; P10–P90: ' + formatExperimentRange(metrics.averageOutputRatePerMinute, ' /min')));
      section.appendChild(createExperimentMetric(label + ' mean Starved', formatExperimentDistribution(metrics.starvedMinutes, ' min'), 'Mean total starvation time; P10–P90: ' + formatExperimentRange(metrics.starvedMinutes, ' min')));
      section.appendChild(createExperimentMetric(label + ' mean Blocked', formatExperimentDistribution(metrics.blockedMinutes, ' min'), 'Mean total blocking time; P10–P90: ' + formatExperimentRange(metrics.blockedMinutes, ' min')));
      section.appendChild(createExperimentMetric(label + ' mean Overflow', formatExperimentDistribution(metrics.overflowUnits, ' units'), 'Mean overflow loss; P10–P90: ' + formatExperimentRange(metrics.overflowUnits, ' units')));
      section.appendChild(createExperimentMetric(label + ' worst overflow', formatExperimentMaximum(metrics.overflowUnits, ' units'), 'Highest overflow observed in any replication. The engineering target is zero.'));
      return section;
    }

    function createComparisonOverview(metrics) {
      var section = document.createElement('section');
      section.className = 'experiment-overview';
      section.appendChild(createExperimentMetric('Δ output', formatExperimentDelta(metrics.outputCount, ' units'), 'Candidate minus baseline. Positive output is favorable.', metrics.outputCount.mean));
      section.appendChild(createExperimentMetric('Δ rate', formatExperimentDelta(metrics.averageOutputRatePerMinute, ' /min'), 'Candidate minus baseline. Positive rate is favorable.', metrics.averageOutputRatePerMinute.mean));
      section.appendChild(createExperimentMetric('Δ Starved', formatExperimentDelta(metrics.starvedMinutes, ' min'), 'Candidate minus baseline. Negative starvation is favorable.', -metrics.starvedMinutes.mean));
      section.appendChild(createExperimentMetric('Δ Blocked', formatExperimentDelta(metrics.blockedMinutes, ' min'), 'Candidate minus baseline. Negative blocking is favorable.', -metrics.blockedMinutes.mean));
      section.appendChild(createExperimentMetric('Δ Overflow', formatExperimentDelta(metrics.overflowUnits, ' units'), 'Candidate minus baseline. Negative overflow is favorable; target is zero.', -metrics.overflowUnits.mean));
      return section;
    }

    function createExperimentMetric(label, value, description, favorableDirection) {
      var card = document.createElement('article');
      card.className = 'experiment-metric';
      if (isFiniteNumber(favorableDirection) && favorableDirection !== 0) {
        card.classList.add(favorableDirection > 0 ? 'experiment-delta-positive' : 'experiment-delta-negative');
      }
      var heading = document.createElement('span');
      heading.textContent = label;
      heading.title = description;
      var metric = document.createElement('b');
      metric.textContent = value;
      card.appendChild(heading);
      card.appendChild(metric);
      return card;
    }

    function createConveyorComparisonTable(zones) {
      var wrapper = document.createElement('div');
      wrapper.className = 'experiment-table-wrap';
      var table = document.createElement('table');
      table.className = 'experiment-table';
      var caption = document.createElement('caption');
      caption.textContent = 'Conveyor comparison — Δ is candidate minus baseline; all dynamic values are means across the shared seed set.';
      table.appendChild(caption);
      var headings = [
        ['Conveyor', 'Physical accumulation zone'],
        ['Audit', 'Baseline audit → candidate audit; this is static design logic, not an average.'],
        ['Δ avg inventory', 'Candidate minus baseline time-weighted average inventory.'],
        ['Δ max inventory', 'Candidate minus baseline maximum observed inventory.'],
        ['Δ empty time', 'Candidate minus baseline empty-conveyor minutes.'],
        ['Δ overflow', 'Candidate minus baseline overflow units.'],
        ['Δ Back-up cycles', 'Candidate minus baseline number of Back-up stop requests.'],
        ['Δ Back-up occupied', 'Candidate minus baseline minutes the Back-up sensor was continuously blocked.']
      ];
      var head = document.createElement('thead');
      var headRow = document.createElement('tr');
      headings.forEach(function(item) {
        var cell = document.createElement('th');
        cell.scope = 'col';
        cell.textContent = item[0];
        cell.title = item[1];
        headRow.appendChild(cell);
      });
      head.appendChild(headRow);
      table.appendChild(head);
      var body = document.createElement('tbody');
      Object.values(zones || {}).sort(function(left, right) { return String(left.name).localeCompare(String(right.name)); }).forEach(function(zone) {
        var row = document.createElement('tr');
        appendExperimentCell(row, zone.name || zone.id);
        appendAuditCell(row, zone.baselineDesign?.auditStatus, zone.candidateDesign?.auditStatus, zone.comparable);
        appendExperimentCell(row, formatExperimentDelta(zone.metrics.averageInventoryUnits, ' units'));
        appendExperimentCell(row, formatExperimentDelta(zone.metrics.maximumInventoryUnits, ' units'));
        appendExperimentCell(row, formatExperimentDelta(zone.metrics.emptyMinutes, ' min'));
        appendExperimentCell(row, formatExperimentDelta(zone.metrics.overflowUnits, ' units'));
        appendExperimentCell(row, formatExperimentDelta(zone.metrics.backupTriggerCount, ''));
        appendExperimentCell(row, formatExperimentDelta(zone.metrics.backupBlockedMinutes, ' min'));
        body.appendChild(row);
      });
      table.appendChild(body);
      wrapper.appendChild(table);
      return wrapper;
    }

    function appendExperimentCell(row, text) {
      var cell = document.createElement('td');
      cell.textContent = text;
      row.appendChild(cell);
    }

    function appendAuditCell(row, baselineStatus, candidateStatus, comparable) {
      var cell = document.createElement('td');
      if (!comparable) {
        cell.textContent = 'Not comparable';
      } else {
        var baseline = document.createElement('span');
        baseline.className = 'audit-' + String(baselineStatus || 'not-evaluated').toLowerCase();
        baseline.textContent = baselineStatus || 'NOT_EVALUATED';
        var arrow = document.createTextNode(' → ');
        var candidate = document.createElement('span');
        candidate.className = 'audit-' + String(candidateStatus || 'not-evaluated').toLowerCase();
        candidate.textContent = candidateStatus || 'NOT_EVALUATED';
        cell.appendChild(baseline);
        cell.appendChild(arrow);
        cell.appendChild(candidate);
      }
      row.appendChild(cell);
    }

    function formatExperimentDistribution(distribution, suffix) {
      return isFiniteNumber(distribution?.mean) ? formatNumber(distribution.mean) + suffix : '—';
    }

    function formatExperimentRange(distribution, suffix) {
      return isFiniteNumber(distribution?.p10) && isFiniteNumber(distribution?.p90)
        ? formatNumber(distribution.p10) + '–' + formatNumber(distribution.p90) + suffix
        : '—';
    }

    function formatExperimentMaximum(distribution, suffix) {
      return isFiniteNumber(distribution?.maximum) ? formatNumber(distribution.maximum) + suffix : '—';
    }

    function formatExperimentDelta(distribution, suffix) {
      if (!isFiniteNumber(distribution?.mean)) return '—';
      return (distribution.mean > 0 ? '+' : '') + formatNumber(distribution.mean) + suffix;
    }

    function formatSeedSet(seeds) {
      if (!seeds || !seeds.length) return '—';
      return seeds.length === 1 ? String(seeds[0]) : seeds[0] + '–' + seeds[seeds.length - 1];
    }

    function cloneJson(value) {
      return JSON.parse(JSON.stringify(value));
    }

    function addControlEvent() {
      if (!state.activeCase || !state.activeCase.equipment.length) return;
      state.run.commands.push({
        atVirtualSecond: 0,
        equipmentId: state.activeCase.equipment[0].id,
        action: 'PAUSE'
      });
      renderControlEvents();
    }

    function renderControlEvents() {
      var target = document.getElementById('control-events');
      target.textContent = '';
      state.run.commands.forEach(function(command, index) {
        target.appendChild(createControlEventRow(command, index));
      });
      if (!state.run.commands.length) {
        target.innerHTML = '<p class="empty compact-empty">No scheduled control events.</p>';
      }
    }

    function createControlEventRow(command, index) {
      var row = document.createElement('article');
      row.className = 'control-event';
      row.innerHTML = '<label>At virtual second<input class="command-time" type="number" min="0" step="any"></label><label>Equipment<select class="command-equipment"></select></label><label>Action<select class="command-action"><option value="RUN">Run</option><option value="PAUSE">Pause</option><option value="STOP">Planned stop</option><option value="EMERGENCY_STOP">Emergency stop</option><option value="RESET">Reset emergency stop</option><option value="MANUAL">Manual</option><option value="AUTO">Automatic</option></select></label><button class="remove-command danger" type="button">Remove</button>';
      var equipmentSelect = row.querySelector('.command-equipment');
      state.activeCase.equipment.forEach(function(equipment) {
        var option = document.createElement('option');
        option.value = equipment.id;
        option.textContent = equipment.name || equipment.id;
        equipmentSelect.appendChild(option);
      });
      row.querySelector('.command-time').value = command.atVirtualSecond;
      equipmentSelect.value = command.equipmentId;
      row.querySelector('.command-action').value = command.action;
      row.querySelector('.command-time').addEventListener('change', function(event) { state.run.commands[index].atVirtualSecond = Number(event.target.value); });
      equipmentSelect.addEventListener('change', function(event) { state.run.commands[index].equipmentId = event.target.value; });
      row.querySelector('.command-action').addEventListener('change', function(event) { state.run.commands[index].action = event.target.value; });
      row.querySelector('.remove-command').addEventListener('click', function() {
        state.run.commands.splice(index, 1);
        renderControlEvents();
      });
      return row;
    }

    function runSimulation() {
      if (state.isDirty) return showError({ code: 'UNSAVED_CASE', message: 'Save the Case before running a simulation.' });
      var run = readRunConfiguration();
      if (!run) return;
      state.run.configuration = copyRunConfiguration(run);
      if (!calculateSimulation(run, 0)) return;
      setStatus(state.run.durationMode === 'INDEFINITE'
        ? 'Simulation completed at its virtual safety ceiling. Playback is starting.'
        : 'Simulation completed. Playback is starting.');
      startPlayback();
    }

    function readRunConfiguration() {
      var durationSeconds = Number(document.getElementById('run-duration').value);
      var sampleEverySeconds = Number(document.getElementById('run-sample-interval').value);
      var seed = Number(document.getElementById('run-seed').value);
      if (!(durationSeconds > 0) || !(sampleEverySeconds > 0) || !Number.isInteger(seed)) {
        showError({ code: 'INVALID_RUN_CONFIGURATION', message: 'Duration, sample interval, and integer seed are required.' });
        return null;
      }
      return {
        durationSeconds: durationSeconds,
        tickSeconds: 0.25,
        sampleEverySeconds: sampleEverySeconds,
        seed: seed,
        commands: state.run.commands.map(function(command) {
          return {
            atVirtualSecond: Number(command.atVirtualSecond),
            equipmentId: command.equipmentId,
            action: command.action
          };
        })
      };
    }

    function copyRunConfiguration(run) {
      return {
        durationSeconds: run.durationSeconds,
        tickSeconds: run.tickSeconds,
        sampleEverySeconds: run.sampleEverySeconds,
        seed: run.seed
      };
    }

    function createStoredRunConfiguration() {
      var configuration = state.run.configuration;
      if (!configuration) return readRunConfiguration();
      return {
        durationSeconds: configuration.durationSeconds,
        tickSeconds: configuration.tickSeconds,
        sampleEverySeconds: configuration.sampleEverySeconds,
        seed: configuration.seed,
        commands: state.run.commands.map(function(command) {
          return {
            atVirtualSecond: Number(command.atVirtualSecond),
            equipmentId: command.equipmentId,
            action: command.action
          };
        })
      };
    }

    function calculateSimulation(run, resumeAtVirtualSecond) {
      var input = {
        case: JSON.parse(JSON.stringify(state.activeCase)),
        run: run
      };
      var response = window.SimulatorEngine.simulateLine(input);
      if (!response.ok) {
        showError(response.error);
        return false;
      }

      stopPlaybackTimer();
      state.run.result = response.result;
      state.run.sampleIndex = findSampleIndexAtOrBefore(response.result.samples, resumeAtVirtualSecond);
      toggle('simulation-results', true);
      document.getElementById('simulation-json-preview').value = JSON.stringify(response.result, null, 2);
      renderPlaybackFrame();
      return true;
    }

    function findSampleIndexAtOrBefore(samples, virtualSecond) {
      var selectedIndex = 0;
      for (var index = 0; index < samples.length; index += 1) {
        if (samples[index].virtualSecond > virtualSecond) break;
        selectedIndex = index;
      }
      return selectedIndex;
    }

    function startPlayback() {
      if (!state.run.result || state.run.playing) return;
      state.run.playing = true;
      schedulePlaybackStep();
    }

    function pausePlayback() {
      state.run.playing = false;
      stopPlaybackTimer();
      setPlaybackStatus('Paused');
    }

    function resetPlayback() {
      pausePlayback();
      if (!state.run.result) return;
      state.run.sampleIndex = 0;
      renderPlaybackFrame();
      setPlaybackStatus('Reset');
    }

    function schedulePlaybackStep() {
      renderPlaybackFrame();
      var samples = state.run.result.samples;
      if (state.run.sampleIndex >= samples.length - 1) {
        state.run.playing = false;
        setPlaybackStatus('Completed');
        return;
      }
      state.run.timer = window.setTimeout(function() {
        if (!state.run.playing) return;
        state.run.sampleIndex += 1;
        schedulePlaybackStep();
      }, playbackDelayMilliseconds());
    }

    function playbackDelayMilliseconds() {
      var samples = state.run.result ? state.run.result.samples : [];
      var current = samples[state.run.sampleIndex];
      var next = samples[state.run.sampleIndex + 1];
      if (!current || !next) return 0;
      var virtualSeconds = Math.max(0, next.virtualSecond - current.virtualSecond);
      var playbackRate = Number(document.getElementById('run-playback-rate').value || 1);
      // At 1×, virtual and wall-clock seconds match. A higher multiplier only
      // speeds up playback; it never changes the deterministic calculation.
      return Math.max(35, virtualSeconds * 1000 / playbackRate);
    }

    function stopPlaybackTimer() {
      if (state.run.timer) window.clearTimeout(state.run.timer);
      state.run.timer = null;
      state.run.playing = false;
    }

    function renderPlaybackFrame() {
      if (!state.run.result || !state.run.result.samples.length) return;
      var scrollAnchor = captureLiveEquipmentScrollAnchor();
      var sample = state.run.result.samples[state.run.sampleIndex];
      var time = sample.virtualSecond;
      document.getElementById('metric-time').textContent = time + ' s';
      document.getElementById('metric-output').textContent = formatNumber(sample.outputCount);
      document.getElementById('metric-instant-rate').textContent = formatInstantaneousOutputRate();
      document.getElementById('metric-rate').textContent = time > 0 ? formatRatePerMinute(sample.outputCount / time) : '—';
      document.getElementById('metric-buffer').textContent = formatNumber(sum(sample.buffers));
      document.getElementById('metric-overflow').textContent = formatNumber(sum((sample.accumulationZones || []).map(function(zone) { return zone.overflowUnits || 0; })));
      document.getElementById('metric-backup-stop').textContent = formatMinutes(sum(sample.equipment.map(function(unit) { return unit.backupStopSeconds || 0; })));
      setPlaybackStatus((state.run.playing ? 'Playing' : 'At') + ' ' + time + ' s · frame ' + state.run.sampleIndex + ' / ' + (state.run.result.samples.length - 1));
      renderLiveEquipment(sample);
      drawSimulationChart();
      drawEquipmentSpeedChart();
      restoreLiveEquipmentScrollAnchor(scrollAnchor);
    }

    function captureLiveEquipmentScrollAnchor() {
      var target = document.getElementById('live-equipment');
      if (!target) return null;
      var viewportHeight = window.innerHeight || document.documentElement.clientHeight || 0;
      if (!(viewportHeight > 0)) return null;
      var cards = target.querySelectorAll('.live-equipment-card');
      for (var index = 0; index < cards.length; index += 1) {

          return {
            equipmentId: cards[index].getAttribute('data-equipment-id'),
            top: bounds.top
          };
        }
      }
      return null;
    }

    function restoreLiveEquipmentScrollAnchor(anchor) {
      if (!anchor || Date.now() - state.lastUserScrollAt < 140) return;
      if (state.scrollRestoreFrame) window.cancelAnimationFrame(state.scrollRestoreFrame);
      state.scrollRestoreFrame = window.requestAnimationFrame(function() {
        state.scrollRestoreFrame = null;
        if (Date.now() - state.lastUserScrollAt < 140) return;
        var target = document.getElementById('live-equipment');
        if (!target) return;
        var cards = target.querySelectorAll('.live-equipment-card');
        var card = null;
        for (var index = 0; index < cards.length; index += 1) {
          if (cards[index].getAttribute('data-equipment-id') === anchor.equipmentId) {
            card = cards[index];
            break;
          }
        }
        if (!card) return;
        var delta = card.getBoundingClientRect().top - anchor.top;
        if (Math.abs(delta) < 2) return;
        state.scrollRestoreUntil = Date.now() + 100;
        window.scrollBy(0, delta);
      });
    }

    function formatInstantaneousOutputRate() {
      if (!state.run.result || state.run.sampleIndex === 0) return '—';
      var current = state.run.result.samples[state.run.sampleIndex];
      var previous = state.run.result.samples[state.run.sampleIndex - 1];
      var elapsed = current.virtualSecond - previous.virtualSecond;
      if (!(elapsed > 0)) return '—';
      return formatRatePerMinute((current.outputCount - previous.outputCount) / elapsed);
    }

    function formatPrimeSensorReading(prime) {
      if (!prime || !prime.configured) return 'Not configured';
      if (prime.state === 'PULSING') return 'PULSING · product passing';
      if (prime.state === 'BLOCKED') return 'BLOCKED · queue present';
      return prime.latched ? 'CLEAR · start sent' : 'CLEAR · waiting';
    }

    function formatBackupSensorReading(backup) {
      if (!backup || !backup.configured) return 'Not configured';
      if (backup.state === 'PULSING') return 'PULSING · normal flow';
      if (backup.state === 'BLOCKED') {
        return backup.controlActive
          ? 'BLOCKED · control active'
          : 'BLOCKED ' + formatSeconds(backup.blockedCandidateSeconds) + ' / ' + formatSeconds(backup.blockedTimeDelaySeconds);
      }
      if (backup.controlActive && backup.clearCandidateSeconds > 0) {
        return 'CLEAR ' + formatSeconds(backup.clearCandidateSeconds) + ' / ' + formatSeconds(backup.clearTimeDelaySeconds);
      }
      return backup.controlActive ? 'CLEAR · awaiting delay' : 'CLEAR';
    }

    function formatSensorTiming(geometry) {
      if (!geometry) return '—';
      var pulse = formatSeconds(geometry.packagePassSensorSeconds);
      var gap = formatSeconds(geometry.sensorClearGapSeconds);
      return pulse === '—' && gap === '—' ? '—' : pulse + ' / ' + gap;
    }

      host.querySelector('.zone-sensor-pulse').textContent = engineeringNumber(calculated.packagePassSensorSeconds, ' s');
      host.querySelector('.zone-sensor-gap').textContent = engineeringNumber(calculated.sensorClearGapSeconds, ' s');

    function engineeringNumber(value, suffix) {
      return isFiniteNumber(value) ? formatNumber(value) + suffix : '—';
    }

function summarizeGeometrySources(sources, assumptions) {
      var details = [];
      if (sources && sources.productPitchMm) details.push('Pitch: ' + sources.productPitchMm);
      if (sources && sources.conveyorSpeedMmPerSecond) details.push('Speed: ' + sources.conveyorSpeedMmPerSecond);
      if (!details.length && Array.isArray(assumptions) && assumptions.length) details.push(assumptions[0]);
      return details.join(' · ');

    function bindLiveEquipmentControl(button, equipmentId, action) {
      button.addEventListener('click', function() {
        applyLiveScenarioControl(equipmentId, action);
      });
    }

    function updateLiveEquipmentControl(button) {
      var sample = state.run.result && state.run.result.samples[state.run.sampleIndex];
      var isAtRunEnd = !sample || sample.virtualSecond >= state.run.result.durationSeconds;
      button.disabled = isAtRunEnd;
      button.title = isAtRunEnd
        ? 'Reset playback to an earlier virtual time before applying a scenario control.'
        : 'Apply at the displayed virtual second and recalculate this simulation scenario.';
    }

    function applyLiveScenarioControl(equipmentId, action) {
      if (!state.run.result) return;
      var sample = state.run.result.samples[state.run.sampleIndex];
      if (!sample || sample.virtualSecond >= state.run.result.durationSeconds) {
        return setStatus('Reset playback to an earlier virtual time before applying a scenario control.');
      }

      var wasPlaying = state.run.playing;
      var actions = action === 'RESET_AND_RUN' ? ['RESET', 'RUN'] : [action];
      actions.forEach(function(nextAction) {
        state.run.commands.push({
          atVirtualSecond: sample.virtualSecond,
          equipmentId: equipmentId,
          action: nextAction
        });
      });
      renderControlEvents();

      var run = createStoredRunConfiguration();
      if (!run || !calculateSimulation(run, sample.virtualSecond)) return;
      var equipment = state.activeCase.equipment.find(function(item) { return item.id === equipmentId; });
      var label = equipment ? equipment.name : equipmentId;
      setStatus((action === 'RESET_AND_RUN' ? 'Reset and run' : action.replace(/_/g, ' ').toLowerCase()) + ' scheduled for ' + label + ' at virtual ' + sample.virtualSecond + ' s. The deterministic path was recalculated.');
      if (wasPlaying) startPlayback();
    }

    function drawSimulationChart() {
      var canvas = document.getElementById('simulation-chart');
      if (!canvas || !state.run.result) return;
      var bounds = canvas.getBoundingClientRect();
      var width = Math.max(1, Math.floor(bounds.width));
      var height = 210;
      var ratio = window.devicePixelRatio || 1;
      canvas.width = width * ratio;
      canvas.height = height * ratio;
      var context = canvas.getContext('2d');
      context.scale(ratio, ratio);
      context.clearRect(0, 0, width, height);

      var padding = { left: 44, right: 16, top: 18, bottom: 30 };
      var plotWidth = width - padding.left - padding.right;
      var plotHeight = height - padding.top - padding.bottom;
      var samples = state.run.result.samples.slice(0, state.run.sampleIndex + 1);
      var maxTime = Math.max(state.run.result.durationSeconds, 1);
      var maxOutput = Math.max(state.run.result.summary.outputCount, 1);
      context.strokeStyle = '#d9e1ef';
      context.lineWidth = 1;
      context.beginPath();
      context.moveTo(padding.left, padding.top);
      context.lineTo(padding.left, padding.top + plotHeight);
      context.lineTo(padding.left + plotWidth, padding.top + plotHeight);
      context.stroke();
      context.strokeStyle = '#3967d6';
      context.lineWidth = 2.5;
      context.beginPath();
      samples.forEach(function(sample, index) {
        var x = padding.left + (sample.virtualSecond / maxTime) * plotWidth;
        var y = padding.top + plotHeight - (sample.outputCount / maxOutput) * plotHeight;
        if (index === 0) context.moveTo(x, y);
        else context.lineTo(x, y);
      });
      context.stroke();
      context.fillStyle = '#657187';
      context.font = '12px Arial';
      context.fillText('Output', padding.left, 12);
      context.fillText('0', padding.left - 8, padding.top + plotHeight + 16);
      context.fillText(formatNumber(maxOutput), padding.left - 34, padding.top + 6);
      context.fillText(maxTime + ' s', padding.left + plotWidth - 24, padding.top + plotHeight + 20);
    }

    function drawEquipmentSpeedChart() {
      var canvas = document.getElementById('equipment-speed-chart');
      var legend = document.getElementById('equipment-speed-legend');
      if (!canvas || !legend || !state.run.result || !state.activeCase) return;

      var samples = getRollingSpeedSamples();
      var models = state.activeCase.equipment || [];
      var drawing = prepareLineCanvas(canvas, 270);
      if (!drawing) return;
      var context = drawing.context;
      var padding = { left: 46, right: 16, top: 22, bottom: 32 };
      var plotWidth = drawing.width - padding.left - padding.right;
      var plotHeight = drawing.height - padding.top - padding.bottom;
      var endTime = samples.length ? samples[samples.length - 1].virtualSecond : 0;
      var startTime = samples.length ? samples[0].virtualSecond : 0;
      var timeRange = Math.max(1, endTime - startTime);
      var maxRate = Math.max(1, models.reduce(function(maximum, model) {
        return Math.max(maximum, Number(model.nominalRatePerSecond || 0) * 60);
      }, 0));
      samples.forEach(function(sample) {
        sample.equipment.forEach(function(unit) {
          maxRate = Math.max(maxRate, Number(unit.actualRatePerSecond || 0) * 60);
        });
      });
      maxRate = Math.ceil(maxRate / 25) * 25 || 25;

      context.strokeStyle = '#d9e1ef';
      context.lineWidth = 1;
      context.beginPath();
      context.moveTo(padding.left, padding.top);
      context.lineTo(padding.left, padding.top + plotHeight);
      context.lineTo(padding.left + plotWidth, padding.top + plotHeight);
      context.stroke();
      for (var grid = 1; grid < 4; grid += 1) {
        var gridY = padding.top + plotHeight - grid / 4 * plotHeight;
        context.strokeStyle = '#edf1f7';
        context.beginPath();
        context.moveTo(padding.left, gridY);
        context.lineTo(padding.left + plotWidth, gridY);
        context.stroke();
      }

      models.forEach(function(model, index) {
        drawSpeedSeries(
          context,
          samples,
          index,
          function(sample) { return padding.left + (sample.virtualSecond - startTime) / timeRange * plotWidth; },
          function(ratePerSecond) { return padding.top + plotHeight - Math.min(maxRate, Number(ratePerSecond || 0) * 60) / maxRate * plotHeight; },
          speedColor(index),
          1.8
        );
      });

      context.fillStyle = '#657187';
      context.font = '12px Arial';
      context.fillText('Actual BPM', padding.left, 13);
      context.fillText('0', padding.left - 10, padding.top + plotHeight + 16);
      context.fillText(formatNumber(maxRate), padding.left - 38, padding.top + 8);
      context.fillText(startTime + '–' + endTime + ' s', Math.max(padding.left, padding.left + plotWidth - 70), padding.top + plotHeight + 20);

      legend.textContent = '';
      models.forEach(function(model, index) {
        var item = document.createElement('span');
        item.className = 'equipment-speed-legend-item';
        var swatch = document.createElement('i');
        swatch.style.backgroundColor = speedColor(index);
        item.appendChild(swatch);
        item.appendChild(document.createTextNode(model.name || model.id || ('Unit ' + (index + 1))));
        legend.appendChild(item);
      });
    }

    function drawEquipmentSpeedSparkline(canvas, equipmentIndex, model) {
      if (!canvas) return;
      var samples = getRollingSpeedSamples();
      var drawing = prepareLineCanvas(canvas, 56);
      if (!drawing) return;
      var context = drawing.context;
      var padding = { left: 2, right: 2, top: 4, bottom: 4 };
      var plotWidth = drawing.width - padding.left - padding.right;
      var plotHeight = drawing.height - padding.top - padding.bottom;
      var endTime = samples.length ? samples[samples.length - 1].virtualSecond : 0;
      var startTime = samples.length ? samples[0].virtualSecond : 0;
      var timeRange = Math.max(1, endTime - startTime);
      var maxRate = Math.max(1, Number(model.nominalRatePerSecond || 0) * 60);
      samples.forEach(function(sample) {
        var unit = sample.equipment[equipmentIndex];
        maxRate = Math.max(maxRate, Number(unit && unit.actualRatePerSecond || 0) * 60);
      });
      maxRate *= 1.05;

      context.strokeStyle = '#e5ebf4';
      context.lineWidth = 1;
      context.beginPath();
      context.moveTo(padding.left, padding.top + plotHeight);
      context.lineTo(padding.left + plotWidth, padding.top + plotHeight);
      context.stroke();
      drawSpeedSeries(
        context,
        samples,
        equipmentIndex,
        function(sample) { return padding.left + (sample.virtualSecond - startTime) / timeRange * plotWidth; },
        function(ratePerSecond) { return padding.top + plotHeight - Math.min(maxRate, Number(ratePerSecond || 0) * 60) / maxRate * plotHeight; },
        speedColor(equipmentIndex),
        1.8
      );
    }

    function drawSpeedSeries(context, samples, equipmentIndex, xForSample, yForRate, color, lineWidth) {
      if (!samples.length) return;
      context.strokeStyle = color;
      context.lineWidth = lineWidth;
      context.lineJoin = 'round';
      context.lineCap = 'round';
      context.beginPath();
      samples.forEach(function(sample, sampleIndex) {
        var unit = sample.equipment[equipmentIndex];
        var x = xForSample(sample);
        var y = yForRate(unit ? unit.actualRatePerSecond : 0);
        if (sampleIndex === 0) context.moveTo(x, y);
        else context.lineTo(x, y);
      });
      context.stroke();
    }

    function getRollingSpeedSamples() {
      if (!state.run.result || !state.run.result.samples) return [];
      var allSamples = state.run.result.samples.slice(0, state.run.sampleIndex + 1);
      if (!allSamples.length) return [];
      var endTime = allSamples[allSamples.length - 1].virtualSecond;
      var startTime = Math.max(0, endTime - 60);
      return allSamples.filter(function(sample) { return sample.virtualSecond >= startTime; });
    }

    function prepareLineCanvas(canvas, height) {
      var bounds = canvas.getBoundingClientRect();
      var width = Math.max(1, Math.floor(bounds.width));
      if (width <= 1) return null;
      var ratio = window.devicePixelRatio || 1;
      canvas.width = width * ratio;
      canvas.height = height * ratio;
      var context = canvas.getContext('2d');
      context.scale(ratio, ratio);
      context.clearRect(0, 0, width, height);
      return { context: context, width: width, height: height };
    }

    function speedColor(index) {
      var colors = ['#3967d6', '#268355', '#b05b12', '#8d4ec4', '#ca3d61', '#187f91', '#7a6c18', '#d05d2b', '#2a62a5', '#4f803f', '#aa4e9b', '#5d6f7c', '#b13838'];
      return colors[index % colors.length];
    }

    function setPlaybackStatus(message) {
      var target = document.getElementById('playback-status');
      if (target) target.textContent = message;
    }

    function sum(values) {
      return values.reduce(function(total, value) { return total + value; }, 0);
    }

    function formatNumber(value) {
      return Number(value || 0).toLocaleString(undefined, { maximumFractionDigits: 2 });
    }

    function formatSeconds(value) {
      return isFiniteNumber(value) ? formatNumber(value) + ' s' : '—';
    }

    function formatRatePerMinute(ratePerSecond) {
      return formatNumber(Number(ratePerSecond || 0) * 60) + ' /min';
    }

    function formatMinutes(seconds) {
      return formatNumber(Number(seconds || 0) / 60) + ' min';
    }

    function callServer(name, args, onSuccess) {
      var runner = google.script.run
        .withFailureHandler(function() { showError({ code: 'NETWORK_ERROR', message: 'The server request could not be completed.' }); })
        .withSuccessHandler(onSuccess);
      runner[name].apply(runner, args);
    }

    function toggle(id, visible) { document.getElementById(id).classList.toggle('hidden', !visible); }
    function setStatus(message) { var target = document.getElementById('status'); target.className = 'status'; target.textContent = message; }
    function showError(error) { var target = document.getElementById('status'); target.className = 'status error'; target.textContent = (error.code || 'ERROR') + ': ' + (error.message || 'The request failed.'); }
    function setBusy(targetId, busy) { var target = document.getElementById(targetId); var button = target.tagName === 'FORM' ? target.querySelector('button') : target; button.disabled = busy; }
  })();
</script>
