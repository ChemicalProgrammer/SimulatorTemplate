<script>
  (function() {
    var state = {
      bootstrap: null,
      activeCase: null,
      isDirty: false,
      run: {
        commands: [],
        result: null,
        sampleIndex: 0,
        timer: null,
        playing: false,
        playbackConfigured: false,
        durationMode: 'FIXED'
      }
    };

    document.addEventListener('DOMContentLoaded', function() {
      bindEvents();
      initialize();
    });
    window.addEventListener('resize', function() { renderPlaybackFrame(); });

    function bindEvents() {
      document.getElementById('workspace-form').addEventListener('submit', saveWorkspace);
      document.getElementById('new-case-form').addEventListener('submit', createDraftCase);
      document.getElementById('create-reference-case').addEventListener('click', createReferenceCase);
      document.getElementById('create-public-demo-case').addEventListener('click', createPublicDemoCase);
      document.getElementById('reload-case').addEventListener('click', reloadActiveCase);
      document.getElementById('save-case').addEventListener('click', saveActiveCase);
      document.getElementById('add-equipment').addEventListener('click', addEquipment);
      document.getElementById('case-editor-form').addEventListener('input', markCaseDirty);
      document.getElementById('equipment-list').addEventListener('input', markCaseDirty);
      document.getElementById('equipment-list').addEventListener('change', markCaseDirty);
      document.getElementById('add-control-event').addEventListener('click', addControlEvent);
      document.getElementById('run-simulation').addEventListener('click', runSimulation);
      document.getElementById('play-simulation').addEventListener('click', startPlayback);
      document.getElementById('pause-simulation').addEventListener('click', pausePlayback);
      document.getElementById('reset-playback').addEventListener('click', resetPlayback);
      document.getElementById('duration-mode').addEventListener('change', function(event) {
        state.run.durationMode = event.target.value;
      });
    }

    function initialize() {
      setStatus('Loading console…');
      callServer('getBootstrap', [], renderBootstrap);
    }

    function renderBootstrap(response) {
      if (!response.ok) return showError(response.error);
      state.bootstrap = response.data;
      document.getElementById('user-email').textContent = response.data.user.email;
      document.getElementById('workspace-folder-id').value = response.data.settings.workspaceRootFolderId || '';
      document.getElementById('playback-rate').value = String(response.data.settings.preferredPlaybackRate || 1);
      if (!state.run.playbackConfigured) {
        document.getElementById('run-playback-rate').value = String(response.data.settings.preferredPlaybackRate || 1);
        state.run.playbackConfigured = true;
      }

      var hasWorkspace = Boolean(response.data.settings.workspaceRootFolderId);
      toggle('workspace-panel', true);
      toggle('cases-panel', hasWorkspace);
      toggle('engine-panel', hasWorkspace);
      renderCases(response.data.cases);
      if (!state.activeCase) setStatus(hasWorkspace ? 'Workspace connected.' : 'Connect a workspace folder to begin.');
    }

    function saveWorkspace(event) {
      event.preventDefault();
      setBusy('workspace-form', true);
      callServer('saveUserSettings', [{
        workspaceRootFolderId: document.getElementById('workspace-folder-id').value,
        preferredPlaybackRate: Number(document.getElementById('playback-rate').value)
      }], function(response) {
        setBusy('workspace-form', false);
        if (!response.ok) return showError(response.error);
        initialize();
      });
    }

    function createDraftCase(event) {
      event.preventDefault();
      var input = document.getElementById('new-case-name');
      setBusy('new-case-form', true);
      callServer('createCase', [{ name: input.value }], function(response) {
        setBusy('new-case-form', false);
        if (!response.ok) return showError(response.error);
        input.value = '';
        openCase(response.data.id);
        initialize();
      });
    }

    function createReferenceCase() {
      setBusy('create-reference-case', true);
      callServer('createReferenceCase', [], function(response) {
        setBusy('create-reference-case', false);
        if (!response.ok) return showError(response.error);
        openCase(response.data.id);
        initialize();
      });
    }

    function createPublicDemoCase() {
      setBusy('create-public-demo-case', true);
      callServer('createPublicDemoCase', [], function(response) {
        setBusy('create-public-demo-case', false);
        if (!response.ok) return showError(response.error);
        openCase(response.data.id);
        initialize();
      });
    }

    function openCase(caseId) {
      callServer('getCase', [caseId], function(response) {
        if (!response.ok) return showError(response.error);
        stopPlaybackTimer();
        state.activeCase = response.data;
        state.isDirty = false;
        state.run.commands = [];
        state.run.result = null;
        renderEditor();
        setStatus('Case loaded.');
      });
    }

    function reloadActiveCase() {
      if (!state.activeCase) return;
      openCase(state.activeCase.id);
    }

    function markCaseDirty() {
      if (!state.activeCase) return;
      state.isDirty = true;
      renderEditorMeta();
      renderRunWorkspace();
    }

    function saveActiveCase() {
      var next = collectCaseEditor();
      if (!next) return;
      setBusy('save-case', true);
      callServer('saveCase', [next], function(response) {
        setBusy('save-case', false);
        if (!response.ok) return showError(response.error);
        state.activeCase = response.data;
        state.isDirty = false;
        renderEditor();
        initialize();
        setStatus('Case saved as revision ' + response.data.revision + '.');
      });
    }

    function addEquipment() {
      if (!syncEquipmentFromEditor()) return;
      state.activeCase.equipment.push(createBlankEquipment());
      state.isDirty = true;
      renderEquipment();
      renderRunWorkspace();
    }

    function renderCases(cases) {
      var target = document.getElementById('cases-list');
      target.textContent = '';
      if (!cases || !cases.length) {
        target.innerHTML = '<p class="empty">No cases yet. Start with a draft or the explicit reference line.</p>';
        return;
      }
      cases.forEach(function(caseSummary) {
        var row = document.createElement('article');
        row.className = 'case-row';
        row.innerHTML = '<div><strong></strong><span></span></div><div class="case-actions"><span></span><button type="button">Open</button></div>';
        row.querySelector('strong').textContent = caseSummary.name;
        var dataLabel = caseSummary.dataClassification === 'PUBLIC_DEMONSTRATION_ONLY' ? ' · public demo data' : '';
        row.querySelector('div span').textContent = caseSummary.equipmentCount + ' equipment units · ' + (caseSummary.isSimulationReady ? 'simulation-ready' : 'draft') + dataLabel;
        row.querySelector('.case-actions span').textContent = new Date(caseSummary.updatedAt).toLocaleString();
        row.querySelector('button').addEventListener('click', function() { openCase(caseSummary.id); });
        target.appendChild(row);
      });
    }

    function renderEditor() {
      if (!state.activeCase) return;
      toggle('editor-panel', true);
      document.getElementById('editor-title').textContent = state.activeCase.name;
      document.getElementById('case-name').value = state.activeCase.name;
      document.getElementById('unit-of-flow').value = state.activeCase.unitOfFlow || '';
      renderEditorMeta();
      renderCaseDataNote();
      renderEquipment();
      renderRawJson();
      renderRunWorkspace();
    }

    function renderEditorMeta() {
      if (!state.activeCase) return;
      var dirtyText = state.isDirty ? ' · unsaved changes' : '';
      document.getElementById('editor-meta').textContent = 'ID: ' + state.activeCase.id + ' · Revision ' + state.activeCase.revision + dirtyText;
    }

    function renderCaseDataNote() {
      var target = document.getElementById('case-data-note');
      var metadata = state.activeCase && state.activeCase.metadata ? state.activeCase.metadata : {};
      var note = typeof metadata.dataNote === 'string' ? metadata.dataNote : '';
      target.textContent = note;
      toggle('case-data-note', Boolean(note));
    }

    function renderEquipment() {
      var target = document.getElementById('equipment-list');
      target.textContent = '';
      state.activeCase.equipment.forEach(function(equipment, index) {
        target.appendChild(createEquipmentCard(equipment, index));
      });
      if (!state.activeCase.equipment.length) {
        target.innerHTML = '<p class="empty">This draft has no equipment. Add at least two units before simulation.</p>';
      }
      renderRawJson();
    }

    function createEquipmentCard(equipment, index) {
      var card = document.createElement('article');
      card.className = 'equipment-card';
      card.dataset.index = String(index);
      card.innerHTML = '<div class="equipment-header"><strong></strong><div class="button-row"><button class="move-up secondary" type="button">↑</button><button class="move-down secondary" type="button">↓</button><button class="remove-equipment danger" type="button">Remove</button></div></div><div class="equipment-grid"><label>Equipment ID<input class="equipment-id"></label><label>Type<select class="equipment-type"><option value="BLOWER">Blower</option><option value="BLOWMOLDER">Blowmolder</option><option value="CONVEYOR">Conveyor</option><option value="PACEMAKER">Pacemaker</option><option value="PUCKER">Pucker</option><option value="FILLER">Filler</option><option value="DEPUCKER">De-pucker</option><option value="SLEEVER">Sleever</option><option value="CASE_PACKER">Case packer</option><option value="PALLETIZER">Palletizer</option><option value="CUSTOM">Other / custom</option></select></label><label>Name<input class="equipment-name"></label><label>Nominal rate / sec<input class="equipment-rate" type="number" min="0" step="any"></label><label>Buffer after unit<input class="equipment-buffer" type="number" min="0" step="any"></label><label>Initial mode<select class="equipment-mode"><option value="AUTO">Automatic</option><option value="MANUAL">Manual</option><option value="PAUSE">Paused</option><option value="STOP">Stopped</option></select></label></div><label class="characteristics-label">Characteristics JSON (optional)<textarea class="equipment-characteristics" spellcheck="false"></textarea></label><label class="characteristics-label">Noise profile JSON (optional)<textarea class="equipment-noise-profile" spellcheck="false"></textarea></label><label class="characteristics-label">Process format data JSON (optional)<textarea class="equipment-process-data" spellcheck="false"></textarea></label>';
      card.querySelector('strong').textContent = 'Step ' + (index + 1);
      card.querySelector('.equipment-id').value = equipment.id || '';
      card.querySelector('.equipment-type').value = equipment.type || 'CUSTOM';
      card.querySelector('.equipment-name').value = equipment.name || '';
      card.querySelector('.equipment-rate').value = equipment.nominalRatePerSecond === undefined ? '' : equipment.nominalRatePerSecond;
      card.querySelector('.equipment-buffer').value = equipment.bufferAfterCapacity === undefined ? '' : equipment.bufferAfterCapacity;
      card.querySelector('.equipment-mode').value = equipment.initialMode || 'AUTO';
      card.querySelector('.equipment-characteristics').value = JSON.stringify(equipment.characteristics || {}, null, 2);
      card.querySelector('.equipment-noise-profile').value = JSON.stringify(equipment.noiseProfile || {}, null, 2);
      card.querySelector('.equipment-process-data').value = JSON.stringify(equipment.processData || {}, null, 2);
      card.querySelector('.move-up').disabled = index === 0;
      card.querySelector('.move-down').disabled = index === state.activeCase.equipment.length - 1;
      card.querySelector('.move-up').addEventListener('click', function() { moveEquipment(index, -1); });
      card.querySelector('.move-down').addEventListener('click', function() { moveEquipment(index, 1); });
      card.querySelector('.remove-equipment').addEventListener('click', function() { removeEquipment(index); });
      return card;
    }

    function moveEquipment(index, direction) {
      if (!syncEquipmentFromEditor()) return;
      var targetIndex = index + direction;
      if (targetIndex < 0 || targetIndex >= state.activeCase.equipment.length) return;
      var moved = state.activeCase.equipment.splice(index, 1)[0];
      state.activeCase.equipment.splice(targetIndex, 0, moved);
      state.isDirty = true;
      renderEquipment();
      renderRunWorkspace();
    }

    function removeEquipment(index) {
      if (!syncEquipmentFromEditor()) return;
      state.activeCase.equipment.splice(index, 1);
      state.isDirty = true;
      renderEquipment();
      renderRunWorkspace();
    }

    function collectCaseEditor() {
      if (!state.activeCase || !syncEquipmentFromEditor()) return null;
      state.activeCase.name = document.getElementById('case-name').value;
      state.activeCase.unitOfFlow = document.getElementById('unit-of-flow').value;
      return {
        id: state.activeCase.id,
        expectedRevision: state.activeCase.revision,
        name: state.activeCase.name,
        unitOfFlow: state.activeCase.unitOfFlow,
        equipment: state.activeCase.equipment,
        engineConfig: state.activeCase.engineConfig || {},
        metadata: state.activeCase.metadata || {}
      };
    }

    function syncEquipmentFromEditor() {
      if (!state.activeCase) return false;
      var cards = Array.prototype.slice.call(document.querySelectorAll('.equipment-card'));
      var equipment = [];
      for (var index = 0; index < cards.length; index += 1) {
        var card = cards[index];
        var characteristics = parseJsonObject(card.querySelector('.equipment-characteristics').value, 'Characteristics', index + 1);
        if (characteristics === null) return false;
        var noiseProfile = parseJsonObject(card.querySelector('.equipment-noise-profile').value, 'Noise profile', index + 1);
        if (noiseProfile === null) return false;
        var processData = parseJsonObject(card.querySelector('.equipment-process-data').value, 'Process format data', index + 1);
        if (processData === null) return false;
        equipment.push({
          id: card.querySelector('.equipment-id').value.trim(),
          type: card.querySelector('.equipment-type').value,
          name: card.querySelector('.equipment-name').value.trim(),
          nominalRatePerSecond: Number(card.querySelector('.equipment-rate').value),
          bufferAfterCapacity: Number(card.querySelector('.equipment-buffer').value),
          initialMode: card.querySelector('.equipment-mode').value,
          characteristics: characteristics,
          noiseProfile: noiseProfile,
          processData: processData
        });
      }
      state.activeCase.equipment = equipment;
      renderRawJson();
      return true;
    }

    function parseJsonObject(rawValue, label, step) {
      if (!rawValue.trim()) return {};
      try {
        var parsed = JSON.parse(rawValue);
        if (!parsed || Array.isArray(parsed) || typeof parsed !== 'object') throw new Error('not an object');
        return parsed;
      } catch (error) {
        showError({ code: 'INVALID_EQUIPMENT_JSON', message: label + ' for equipment step ' + step + ' must contain a JSON object.' });
        return null;
      }
    }

    function createBlankEquipment() {
      return {
        id: '',
        type: 'CUSTOM',
        name: '',
        nominalRatePerSecond: undefined,
        bufferAfterCapacity: undefined,
        initialMode: 'AUTO',
        characteristics: {},
        noiseProfile: {},
        processData: {}
      };
    }

    function renderRawJson() {
      var preview = document.getElementById('case-json-preview');
      if (state.activeCase) preview.value = JSON.stringify(state.activeCase, null, 2);
    }

    function renderRunWorkspace() {
      var canRender = Boolean(state.activeCase);
      toggle('run-panel', canRender);
      if (!canRender) return;
      var ready = isRunReady();
      document.getElementById('run-case-meta').textContent = state.activeCase.name + ' · revision ' + state.activeCase.revision + (state.isDirty ? ' · save changes before running' : '');
      toggle('run-not-ready', !ready || state.isDirty);
      document.getElementById('run-simulation').disabled = !ready || state.isDirty;
      renderControlEvents();
      if (!state.run.result) toggle('simulation-results', false);
    }

    function isRunReady() {
      return state.activeCase && Array.isArray(state.activeCase.equipment) && state.activeCase.equipment.length >= 2;
    }

    function addControlEvent() {
      if (!state.activeCase || !state.activeCase.equipment.length) return;
      state.run.commands.push({
        atVirtualSecond: 0,
        equipmentId: state.activeCase.equipment[0].id,
        action: 'PAUSE'
      });
      renderControlEvents();
    }

    function renderControlEvents() {
      var target = document.getElementById('control-events');
      target.textContent = '';
      state.run.commands.forEach(function(command, index) {
        target.appendChild(createControlEventRow(command, index));
      });
      if (!state.run.commands.length) {
        target.innerHTML = '<p class="empty compact-empty">No scheduled control events.</p>';
      }
    }

    function createControlEventRow(command, index) {
      var row = document.createElement('article');
      row.className = 'control-event';
      row.innerHTML = '<label>At virtual second<input class="command-time" type="number" min="0" step="any"></label><label>Equipment<select class="command-equipment"></select></label><label>Action<select class="command-action"><option value="RUN">Run</option><option value="PAUSE">Pause</option><option value="STOP">Planned stop</option><option value="EMERGENCY_STOP">Emergency stop</option><option value="RESET">Reset emergency stop</option><option value="MANUAL">Manual</option><option value="AUTO">Automatic</option></select></label><button class="remove-command danger" type="button">Remove</button>';
      var equipmentSelect = row.querySelector('.command-equipment');
      state.activeCase.equipment.forEach(function(equipment) {
        var option = document.createElement('option');
        option.value = equipment.id;
        option.textContent = equipment.name || equipment.id;
        equipmentSelect.appendChild(option);
      });
      row.querySelector('.command-time').value = command.atVirtualSecond;
      equipmentSelect.value = command.equipmentId;
      row.querySelector('.command-action').value = command.action;
      row.querySelector('.command-time').addEventListener('change', function(event) { state.run.commands[index].atVirtualSecond = Number(event.target.value); });
      equipmentSelect.addEventListener('change', function(event) { state.run.commands[index].equipmentId = event.target.value; });
      row.querySelector('.command-action').addEventListener('change', function(event) { state.run.commands[index].action = event.target.value; });
      row.querySelector('.remove-command').addEventListener('click', function() {
        state.run.commands.splice(index, 1);
        renderControlEvents();
      });
      return row;
    }

    function runSimulation() {
      if (state.isDirty) return showError({ code: 'UNSAVED_CASE', message: 'Save the Case before running a simulation.' });
      var run = readRunConfiguration();
      if (!run) return;
      var input = {
        case: JSON.parse(JSON.stringify(state.activeCase)),
        run: run
      };
      var response = window.SimulatorEngine.simulateLine(input);
      if (!response.ok) return showError(response.error);

      stopPlaybackTimer();
      state.run.result = response.result;
      state.run.sampleIndex = 0;
      toggle('simulation-results', true);
      document.getElementById('simulation-json-preview').value = JSON.stringify(response.result, null, 2);
      renderPlaybackFrame();
      setStatus(state.run.durationMode === 'INDEFINITE'
        ? 'Simulation completed at its virtual safety ceiling. Playback is starting.'
        : 'Simulation completed. Playback is starting.');
      startPlayback();
    }

    function readRunConfiguration() {
      var durationSeconds = Number(document.getElementById('run-duration').value);
      var sampleEverySeconds = Number(document.getElementById('run-sample-interval').value);
      var seed = Number(document.getElementById('run-seed').value);
      if (!(durationSeconds > 0) || !(sampleEverySeconds > 0) || !Number.isInteger(seed)) {
        showError({ code: 'INVALID_RUN_CONFIGURATION', message: 'Duration, sample interval, and integer seed are required.' });
        return null;
      }
      return {
        durationSeconds: durationSeconds,
        tickSeconds: 1,
        sampleEverySeconds: sampleEverySeconds,
        seed: seed,
        commands: state.run.commands.map(function(command) {
          return {
            atVirtualSecond: Number(command.atVirtualSecond),
            equipmentId: command.equipmentId,
            action: command.action
          };
        })
      };
    }

    function startPlayback() {
      if (!state.run.result || state.run.playing) return;
      state.run.playing = true;
      schedulePlaybackStep();
    }

    function pausePlayback() {
      state.run.playing = false;
      stopPlaybackTimer();
      setPlaybackStatus('Paused');
    }

    function resetPlayback() {
      pausePlayback();
      if (!state.run.result) return;
      state.run.sampleIndex = 0;
      renderPlaybackFrame();
      setPlaybackStatus('Reset');
    }

    function schedulePlaybackStep() {
      renderPlaybackFrame();
      var samples = state.run.result.samples;
      if (state.run.sampleIndex >= samples.length - 1) {
        state.run.playing = false;
        setPlaybackStatus('Completed');
        return;
      }
      state.run.timer = window.setTimeout(function() {
        if (!state.run.playing) return;
        state.run.sampleIndex += 1;
        schedulePlaybackStep();
      }, playbackDelayMilliseconds());
    }

    function playbackDelayMilliseconds() {
      return Math.max(35, 420 / Number(document.getElementById('run-playback-rate').value || 1));
    }

    function stopPlaybackTimer() {
      if (state.run.timer) window.clearTimeout(state.run.timer);
      state.run.timer = null;
      state.run.playing = false;
    }

    function renderPlaybackFrame() {
      if (!state.run.result || !state.run.result.samples.length) return;
      var sample = state.run.result.samples[state.run.sampleIndex];
      var time = sample.virtualSecond;
      document.getElementById('metric-time').textContent = time + ' s';
      document.getElementById('metric-output').textContent = formatNumber(sample.outputCount);
      document.getElementById('metric-rate').textContent = time > 0 ? formatNumber(sample.outputCount / time) + ' /s' : '—';
      document.getElementById('metric-buffer').textContent = formatNumber(sum(sample.buffers));
      setPlaybackStatus('Playing ' + state.run.sampleIndex + ' / ' + (state.run.result.samples.length - 1));
      renderLiveEquipment(sample);
      drawSimulationChart();
    }

    function renderLiveEquipment(sample) {
      var target = document.getElementById('live-equipment');
      target.textContent = '';
      sample.equipment.forEach(function(unit, index) {
        var model = state.activeCase.equipment[index] || {};
        var card = document.createElement('article');
        var availabilityState = unit.availabilityState || unit.mode || 'UNKNOWN';
        card.className = 'live-equipment-card state-' + availabilityState.toLowerCase().replace(/_/g, '-');
        card.innerHTML = '<div class="live-equipment-title"><strong></strong><span class="live-state"></span></div><span class="live-command"></span><div class="live-equipment-stats"><div><span class="live-flow-label"></span><b class="live-processed"></b></div><div><span>Actual rate</span><b class="live-rate"></b></div><div><span>Starved</span><b class="live-starved"></b></div><div><span>Blocked</span><b class="live-blocked"></b></div><div><span>Failure</span><b class="live-failure"></b></div><div><span>Emergency stop</span><b class="live-emergency"></b></div></div>';
        card.querySelector('strong').textContent = model.name || unit.id;
        card.querySelector('.live-state').textContent = availabilityState;
        card.querySelector('.live-command').textContent = 'Command: ' + unit.mode;
        card.querySelector('.live-flow-label').textContent = index === 0 ? 'Produced' : 'Processed';
        card.querySelector('.live-processed').textContent = formatNumber(unit.processedUnits === undefined ? unit.outputCount : unit.processedUnits);
        card.querySelector('.live-rate').textContent = formatRatePerMinute(unit.actualRatePerSecond);
        card.querySelector('.live-starved').textContent = formatMinutes(unit.starvedSeconds);
        card.querySelector('.live-blocked').textContent = formatMinutes(unit.blockedSeconds);
        card.querySelector('.live-failure').textContent = formatMinutes(unit.failureSeconds);
        card.querySelector('.live-emergency').textContent = formatMinutes(unit.emergencyStopSeconds);
        target.appendChild(card);
      });
    }

    function drawSimulationChart() {
      var canvas = document.getElementById('simulation-chart');
      if (!canvas || !state.run.result) return;
      var bounds = canvas.getBoundingClientRect();
      var width = Math.max(1, Math.floor(bounds.width));
      var height = 210;
      var ratio = window.devicePixelRatio || 1;
      canvas.width = width * ratio;
      canvas.height = height * ratio;
      var context = canvas.getContext('2d');
      context.scale(ratio, ratio);
      context.clearRect(0, 0, width, height);

      var padding = { left: 44, right: 16, top: 18, bottom: 30 };
      var plotWidth = width - padding.left - padding.right;
      var plotHeight = height - padding.top - padding.bottom;
      var samples = state.run.result.samples.slice(0, state.run.sampleIndex + 1);
      var maxTime = Math.max(state.run.result.durationSeconds, 1);
      var maxOutput = Math.max(state.run.result.summary.outputCount, 1);
      context.strokeStyle = '#d9e1ef';
      context.lineWidth = 1;
      context.beginPath();
      context.moveTo(padding.left, padding.top);
      context.lineTo(padding.left, padding.top + plotHeight);
      context.lineTo(padding.left + plotWidth, padding.top + plotHeight);
      context.stroke();
      context.strokeStyle = '#3967d6';
      context.lineWidth = 2.5;
      context.beginPath();
      samples.forEach(function(sample, index) {
        var x = padding.left + (sample.virtualSecond / maxTime) * plotWidth;
        var y = padding.top + plotHeight - (sample.outputCount / maxOutput) * plotHeight;
        if (index === 0) context.moveTo(x, y);
        else context.lineTo(x, y);
      });
      context.stroke();
      context.fillStyle = '#657187';
      context.font = '12px Arial';
      context.fillText('Output', padding.left, 12);
      context.fillText('0', padding.left - 8, padding.top + plotHeight + 16);
      context.fillText(formatNumber(maxOutput), padding.left - 34, padding.top + 6);
      context.fillText(maxTime + ' s', padding.left + plotWidth - 24, padding.top + plotHeight + 20);
    }

    function setPlaybackStatus(message) {
      var target = document.getElementById('playback-status');
      if (target) target.textContent = message;
    }

    function sum(values) {
      return values.reduce(function(total, value) { return total + value; }, 0);
    }

    function formatNumber(value) {
      return Number(value || 0).toLocaleString(undefined, { maximumFractionDigits: 2 });
    }

    function formatRatePerMinute(ratePerSecond) {
      return formatNumber(Number(ratePerSecond || 0) * 60) + ' /min';
    }

    function formatMinutes(seconds) {
      return formatNumber(Number(seconds || 0) / 60) + ' min';
    }

    function callServer(name, args, onSuccess) {
      var runner = google.script.run
        .withFailureHandler(function() { showError({ code: 'NETWORK_ERROR', message: 'The server request could not be completed.' }); })
        .withSuccessHandler(onSuccess);
      runner[name].apply(runner, args);
    }

    function toggle(id, visible) { document.getElementById(id).classList.toggle('hidden', !visible); }
    function setStatus(message) { var target = document.getElementById('status'); target.className = 'status'; target.textContent = message; }
    function showError(error) { var target = document.getElementById('status'); target.className = 'status error'; target.textContent = (error.code || 'ERROR') + ': ' + (error.message || 'The request failed.'); }
    function setBusy(targetId, busy) { var target = document.getElementById(targetId); var button = target.tagName === 'FORM' ? target.querySelector('button') : target; button.disabled = busy; }
  })();
</script>
