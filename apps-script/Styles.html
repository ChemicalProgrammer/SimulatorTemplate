<style>
  :root { color-scheme: light; font-family: Arial, sans-serif; background: #f4f7fb; color: #172033; }
  * { box-sizing: border-box; }
  body { margin: 0; }
  .app-shell { max-width: 980px; margin: 0 auto; padding: 32px 20px 56px; }
  .topbar, .section-heading, .equipment-header { display: flex; align-items: center; justify-content: space-between; gap: 18px; }
  .eyebrow { color: #3967d6; font-size: 11px; font-weight: 700; letter-spacing: .12em; margin: 0 0 6px; }
  h1, h2, p { margin-top: 0; }
  h1 { margin-bottom: 0; font-size: 28px; }
  h2 { margin-bottom: 6px; font-size: 18px; }
  p { color: #576275; line-height: 1.5; }
  .user-chip { background: #e8efff; border-radius: 99px; color: #264ca7; font-size: 13px; padding: 8px 12px; }
  .status { margin: 24px 0 16px; color: #576275; }
  .status.error { color: #a12b2b; }
  .card { background: #fff; border: 1px solid #e0e6f0; border-radius: 14px; box-shadow: 0 8px 24px rgba(32, 57, 95, .06); margin-top: 16px; padding: 22px; }
  .hidden { display: none; }
  form { display: grid; gap: 9px; max-width: 620px; }
  input, select, button, textarea { border-radius: 8px; font: inherit; padding: 10px 12px; }
  input, select { border: 1px solid #c7d1e0; }
  button { background: #3967d6; border: 0; color: #fff; cursor: pointer; font-weight: 700; margin-top: 6px; }
  button:hover { background: #2d57bb; }
  button:disabled { cursor: wait; opacity: .65; }
  button.secondary { background: #e8efff; color: #264ca7; }
  button.secondary:hover { background: #dbe6ff; }
  button.danger { background: #fae8e8; color: #a12b2b; }
  button.danger:hover { background: #f5d8d8; }
  .button-row { align-items: center; display: flex; flex-wrap: wrap; gap: 8px; }
  .button-row button { margin: 0; }
  .new-case-form { align-items: end; display: grid; grid-template-columns: minmax(0, 1fr) auto; margin: 20px 0; max-width: 620px; }
  .cases-list { display: grid; gap: 10px; }
  .case-row { align-items: center; background: #f8faff; border-radius: 10px; display: flex; justify-content: space-between; padding: 14px; }
  .case-row strong, .case-row span { display: block; }
  .case-row span { color: #657187; font-size: 13px; margin-top: 3px; }
  .case-actions { align-items: center; display: flex; gap: 12px; }
  .case-actions button { margin: 0; }
  .empty { color: #657187; padding: 18px 0; }
  .field-grid, .equipment-grid { display: grid; gap: 12px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .field-grid { margin: 20px 0; max-width: 760px; }
  label { color: #3d485a; display: grid; font-size: 13px; font-weight: 700; gap: 6px; }
  .editor-subheading { align-items: center; display: flex; justify-content: space-between; margin-top: 28px; }
  .editor-subheading h3 { margin: 0 0 4px; }
  .editor-subheading p { margin-bottom: 0; }
  .equipment-list { display: grid; gap: 14px; margin-top: 14px; }
  .equipment-card { background: #f8faff; border: 1px solid #e0e6f0; border-radius: 10px; padding: 16px; }
  .equipment-header strong { color: #264ca7; }
  .characteristics-label { margin-top: 12px; }
  textarea { border: 1px solid #c7d1e0; min-height: 104px; resize: vertical; width: 100%; }
  .raw-viewer { margin-top: 22px; }
  .raw-viewer summary { color: #264ca7; cursor: pointer; font-weight: 700; }
  .raw-viewer textarea { font-family: Consolas, monospace; margin-top: 12px; min-height: 260px; }
  .sr-only { height: 1px; margin: -1px; overflow: hidden; position: absolute; width: 1px; }
  @media (max-width: 600px) { .topbar, .section-heading, .editor-subheading, .equipment-header { align-items: flex-start; flex-direction: column; } .field-grid, .equipment-grid, .new-case-form { grid-template-columns: 1fr; } .case-row, .case-actions { align-items: flex-start; flex-direction: column; } }
</style>
